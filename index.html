<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kubo — Remessas Suíça → PALOP</title>
<meta name="description" content="Kubo: remessas de dinheiro simples e transparentes da Suíça para Angola, Cabo Verde, Guiné-Bissau, São Tomé e Príncipe e Moçambique." />
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-border: #23272e;
    --text: #f2f3f5;
    --muted: #9aa1ab;
    --accent: #2dd4a7;
    --accent-dark: #1ba381;
    --danger: #f16d6d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 64px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 36px; }
  .logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .logo span { color: var(--accent); }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  .section-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .corridors {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .corridor-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    text-align: left;
  }
  .corridor-card:hover { border-color: #3a4048; }
  .corridor-card:active { transform: scale(0.98); }
  .corridor-card.selected {
    border-color: var(--accent);
    background: rgba(45, 212, 167, 0.08);
  }
  .corridor-card .flag { font-size: 26px; line-height: 1; }
  .corridor-card .code {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.03em;
  }
  .corridor-card.selected .code { color: var(--accent); }
  .corridor-card .name {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  .corridor-card:not(.selected) .code { color: var(--muted); }

  form { display: flex; flex-direction: column; gap: 10px; }
  input[type="email"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="email"]::placeholder { color: var(--muted); }
  input[type="email"]:focus { border-color: var(--accent); }
  input[type="email"].invalid { border-color: var(--danger); }

  button[type="submit"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #04140f;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button[type="submit"]:hover { background: var(--accent-dark); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .msg.show { display: block; }
  .msg.success { background: rgba(45, 212, 167, 0.12); color: var(--accent); border: 1px solid rgba(45, 212, 167, 0.3); }
  .msg.info { background: rgba(154, 161, 171, 0.12); color: var(--text); border: 1px solid var(--panel-border); }
  .msg.error { background: rgba(241, 109, 109, 0.1); color: var(--danger); border: 1px solid rgba(241, 109, 109, 0.3); }

  footer {
    margin-top: auto;
    padding-top: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="logo">Ku<span>bo</span></h1>
      <p class="subtitle">Remessas de dinheiro da Suíça para África, sem surpresas na taxa.</p>
    </header>

    <div>
      <p class="section-label">Escolhe o teu corredor</p>
      <div class="corridors" id="corridors">
        <button type="button" class="corridor-card" data-code="AO">
          <span class="flag">🇦🇴</span>
          <span class="code">AO</span>
          <span class="name">Angola</span>
        </button>
        <button type="button" class="corridor-card" data-code="CV">
          <span class="flag">🇨🇻</span>
          <span class="code">CV</span>
          <span class="name">Cabo Verde</span>
        </button>
        <button type="button" class="corridor-card" data-code="GW">
          <span class="flag">🇬🇼</span>
          <span class="code">GW</span>
          <span class="name">Guiné-Bissau</span>
        </button>
        <button type="button" class="corridor-card" data-code="ST">
          <span class="flag">🇸🇹</span>
          <span class="code">ST</span>
          <span class="name">São Tomé e Príncipe</span>
        </button>
        <button type="button" class="corridor-card" data-code="MZ">
          <span class="flag">🇲🇿</span>
          <span class="code">MZ</span>
          <span class="name">Moçambique</span>
        </button>
      </div>

      <p class="section-label">Entra na lista de espera</p>
      <form id="waitlist-form" novalidate>
        <input type="email" id="email-input" placeholder="o-teu-email@exemplo.com" autocomplete="email" required />
        <button type="submit" id="submit-btn">Entrar na waitlist</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <footer>Kubo &middot; feito para quem envia dinheiro para casa</footer>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://peqmbseikyktapqcqldb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yJAnTF8HzPqGIuOqd07Ptw_-IYwEB81';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const corridorsEl = document.getElementById('corridors');
    const form = document.getElementById('waitlist-form');
    const emailInput = document.getElementById('email-input');
    const submitBtn = document.getElementById('submit-btn');
    const msgEl = document.getElementById('msg');

    let selectedCorridor = null;

    corridorsEl.addEventListener('click', (e) => {
      const card = e.target.closest('.corridor-card');
      if (!card) return;
      selectedCorridor = card.dataset.code;
      [...corridorsEl.children].forEach((c) => c.classList.toggle('selected', c === card));
      hideMsg();
    });

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = `msg show ${type}`;
    }

    function hideMsg() {
      msgEl.className = 'msg';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();

      const email = emailInput.value.trim();

      if (!isValidEmail(email)) {
        emailInput.classList.add('invalid');
        showMsg('Introduz um email válido.', 'error');
        emailInput.focus();
        return;
      }
      emailInput.classList.remove('invalid');

      if (!selectedCorridor) {
        showMsg('Escolhe primeiro o corredor que te interessa.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'A processar…';

      const { error } = await supabase
        .from('waitlist_signups')
        .insert({ email, corridor: selectedCorridor });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar na waitlist';

      if (error) {
        if (error.code === '23505') {
          showMsg('Este email já está na nossa lista de espera. Obrigado pela paciência!', 'info');
        } else {
          showMsg('Não foi possível concluir a inscrição. Tenta novamente.', 'error');
        }
        return;
      }

      form.reset();
      selectedCorridor = null;
      [...corridorsEl.children].forEach((c) => c.classList.remove('selected'));
      showMsg('Estás na lista! Avisamos-te assim que o Kubo estiver disponível no teu corredor.', 'success');
    });
  </script>
</body>
</html>
